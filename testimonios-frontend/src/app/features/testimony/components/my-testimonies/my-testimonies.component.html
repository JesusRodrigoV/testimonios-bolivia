<div class="testimonies-page">
  <div class="page-header">
    <h2>Mis Testimonios</h2>
    <button mat-raised-button color="primary" routerLink="/submit-testimony">
      <mat-icon>add</mat-icon>
      Nuevo testimonio
    </button>
  </div>

  <div class="testimonies-grid">
    @if (loading()) {
      @for (i of [1,2,3]; track i) {
        <div class="skeleton-card">
          <div class="skeleton-header">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-badge"></div>
          </div>
          <div class="skeleton-line skeleton-desc"></div>
          <div class="skeleton-line skeleton-desc short"></div>
          <div class="skeleton-meta">
            <div class="skeleton-line skeleton-icon"></div>
            <div class="skeleton-line skeleton-icon"></div>
          </div>
        </div>
      }
    } @else if (error()) {
      <div class="error-state">
        <mat-icon>error</mat-icon>
        <p>{{ error() }}</p>
        <button mat-raised-button color="primary" (click)="loadTestimonies()">
          Reintentar
        </button>
      </div>
    } @else {
      @for (testimony of testimonies(); track testimony.id) {
        <app-testimony-card
          [testimony]="testimony"
          (edit)="editTestimony($event)"
          (delete)="deleteTestimony($event)"
        />
      } @empty {
        <div class="empty-state">
          <mat-icon>inbox</mat-icon>
          <p>No tenés testimonios todavía.</p>
          <button mat-raised-button color="primary" routerLink="/submit-testimony">
            Crear tu primer testimonio
          </button>
        </div>
      }
    }
  </div>
</div>
